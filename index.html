<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPACITY CONNECT | NEXAURA</title><style>
:root{--n:#09213f;--b:#1769e0;--c:#14b8c4;--bg:#f5f7fb;--line:#e5e9f0;--muted:#667085;--g:#11845f;--a:#b97808}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:linear-gradient(135deg,#071a31,#104b80)}.hero{padding:8%;color:white;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.98;margin:20px 0}.hero p{max-width:650px;font-size:18px;line-height:1.6;color:#d7e6f7}.pill{display:inline-block;border:1px solid #ffffff30;background:#ffffff12;border-radius:30px;padding:7px 12px;width:max-content}.loginbox{background:#fff;margin:auto 7% auto 0;padding:38px;border-radius:24px;box-shadow:0 25px 70px #0005;max-width:500px;width:86%}.loginbox h2{font-size:30px;margin:0 0 6px}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce2eb;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:750}.primary{background:var(--b);color:#fff}.light{background:#edf3fc;color:#1457ad}.dark{background:var(--n);color:#fff}.accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.acc{background:#fafbfc;border:1px solid var(--line);padding:10px;border-radius:10px;text-align:left}.acc b,.acc small{display:block}.acc small{color:var(--muted)}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{font-weight:900;color:var(--n);font-size:17px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--b),var(--c));color:#fff;margin-right:8px}.topright{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e7f0ff;color:#1559b8;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr}.side{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 70px);padding:15px 10px}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:9px;color:#5c6678;font-weight:700}.nav:hover,.nav.on{background:#edf4ff;color:#155bbb}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.welcome{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}.welcome h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 8px 26px #10294b0b}.card h3{margin:0 0 12px}.statlab{font-size:11px;font-weight:800;color:var(--muted)}.stat{font-size:28px;font-weight:900;margin:5px 0}.bar{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c));border-radius:20px}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf4ff;color:#145bbb;font-size:11px;font-weight:800}.green{background:#e9f8f1;color:var(--g)}.amber{background:#fff4dd;color:var(--a)}.red{background:#fff0f0;color:#b83e3e}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{border:1px solid var(--line);border-radius:11px;padding:12px}.list{display:grid;gap:10px}.heroCard{background:linear-gradient(135deg,#0a2850,#1769e0);color:#fff;border:0}.heroCard .muted{color:#dbe9fb}.course{display:flex;flex-direction:column}.course p{line-height:1.5}.course .actions{margin-top:auto}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;background:#07132699;display:grid;place-items:center;padding:20px;z-index:50}.modalbox{background:#fff;border-radius:18px;padding:24px;max-width:760px;width:100%;max-height:90vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 15px;border-radius:10px;z-index:100}.quiz{border:1px solid var(--line);padding:14px;border-radius:11px;margin:10px 0}.quiz label{display:block;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{padding:35px}.loginbox{margin:0 auto 30px;width:92%;max-width:none}.layout{grid-template-columns:1fr}.side{min-height:auto;display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.stats,.three{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:580px){.main{padding:16px}.stats,.three{grid-template-columns:1fr}.accounts{grid-template-columns:1fr}.top{padding:0 14px}.top .light{display:none}}
</style></head><body><div id="root"></div><div id="modal" class="modal hide"></div><div id="toast" class="toast hide"></div><script>
const D={users:[{id:1,name:'Aarav Sharma',email:'trainee@capacityconnect.demo',role:'Trainee',initials:'AS',skills:['Weather Forecasting','Python','Data Analysis'],qualification:'B.Tech Atmospheric Sciences',experience:'2 years',cert:3,progress:72,comp:{Forecasting:82,'Data Analysis':76,'Climate Modelling':38}},{id:2,name:'Dr. Meera Iyer',email:'trainer@capacityconnect.demo',role:'Trainer',initials:'MI',skills:['Numerical Weather Prediction','Climate Modelling','Satellite Meteorology'],qualification:'Ph.D. Atmospheric Science',experience:'12 years',cert:8,comp:{Forecasting:95,'Climate Modelling':94,'Satellite Meteorology':91}},{id:3,name:'Admin User',email:'admin@capacityconnect.demo',role:'Admin',initials:'AU'}],courses:[{id:1,title:'Advanced Weather Forecasting',subject:'Meteorology',trainer:'Dr. Meera Iyer',duration:'6 weeks',level:'Advanced',comp:'Forecasting',progress:72,enrolled:true,desc:'Operational forecasting concepts, interpretation and practical forecasting workflows.'},{id:2,title:'Climate Modelling Fundamentals',subject:'Climate Science',trainer:'Dr. Meera Iyer',duration:'4 weeks',level:'Intermediate',comp:'Climate Modelling',progress:0,enrolled:false,desc:'Core concepts, model structure, datasets and interpretation of climate-model outputs.'},{id:3,title:'Satellite Meteorology',subject:'Remote Sensing',trainer:'Dr. Meera Iyer',duration:'3 weeks',level:'Intermediate',comp:'Satellite Meteorology',progress:0,enrolled:false,desc:'Satellite observations, imagery interpretation and meteorological applications.'},{id:4,title:'Python for Meteorological Data',subject:'Data Science',trainer:'Dr. Meera Iyer',duration:'5 weeks',level:'Beginner',comp:'Data Analysis',progress:45,enrolled:true,desc:'Practical Python workflows for cleaning, exploring and visualising meteorological data.'}],assess:[{id:1,title:'Weather Forecasting — MCQ',course:'Advanced Weather Forecasting',score:84,status:'Completed'},{id:2,title:'Climate Modelling — Diagnostic',course:'Climate Modelling Fundamentals',score:null,status:'Pending'}],trainers:[{name:'Dr. Meera Iyer',expertise:'Forecasting • Climate Modelling • Satellite Meteorology',match:96},{name:'Dr. Rajiv Menon',expertise:'Data Analysis • Python • Numerical Methods',match:81},{name:'Dr. Kavya Rao',expertise:'Climate Science • Remote Sensing',match:74}]};let S={u:null,page:'dashboard'};
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2200)}function nav(p){S.page=p;render()}function badge(x,c=''){return `<span class="tag ${c}">${esc(x)}</span>`}function stat(a,b,c){return `<div class="card"><div class="statlab">${a}</div><div class="stat">${b}</div><div class="small muted">${c}</div></div>`}
function login(u){S.u=u;S.page='dashboard';render()}function logout(){S.u=null;render()}function renderLogin(){$('root').innerHTML=`<div class="login"><section class="hero"><span class="pill">NEXAURA • SIH26075 • Smart Education</span><h1>Connect people.<br>Map skills.<br>Build capability.</h1><p>CAPACITY CONNECT is a competency-first digital capacity-building and learning management portal connecting trainees, trainers, courses, assessments and outcomes in one secure ecosystem.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">● Trainee</span><span class="pill">● Trainer</span><span class="pill">● Admin</span></div></section><section class="loginbox"><h2>Welcome back</h2><p class="muted">Use a demo account. Everything runs in memory.</p><div class="field"><label>Email</label><input id="email" value="trainee@capacityconnect.demo"></div><div class="field"><label>Password</label><input id="pass" type="password" value="demo123"></div><button class="btn primary" style="width:100%" onclick="doLogin()">Sign in to demo</button><p class="muted" style="font-size:12px">Password for all demo accounts: <b>demo123</b></p><div class="accounts">${D.users.map(u=>`<button class="acc" onclick="fill('${u.email}')"><b>${u.role}</b><small>${u.email}</small></button>`).join('')}</div></section></div>`}function fill(e){$('email').value=e;$('pass').value='demo123'}function doLogin(){let u=D.users.find(x=>x.email===$('email').value.trim().toLowerCase());u?login(u):toast('Choose a demo account')}
function shell(content){let menus=S.u.role==='Trainee'?[['dashboard','Dashboard'],['profile','My Profile'],['courses','Courses'],['competency','Competency Map'],['assessments','Assessments'],['feedback','Feedback'],['notifications','Notifications']]:S.u.role==='Trainer'?[['dashboard','Dashboard'],['profile','Trainer Profile'],['courses','My Courses'],['library','Trainer Library'],['questionnaire','Questionnaire'],['trainees','Trainees'],['notifications','Notifications']]:[['dashboard','Dashboard'],['users','User Management'],['courses','Course Management'],['analytics','Analytics'],['notifications','Notifications']];return `<header class="top"><div class="brand"><span class="mark">C</span>CAPACITY CONNECT</div><div class="topright">${badge(S.u.role)}<span class="avatar">${S.u.initials}</span><button class="btn light" onclick="logout()">Sign out</button></div></header><div class="layout"><aside class="side">${menus.map(m=>`<button class="nav ${S.page===m[0]?'on':''}" onclick="nav('${m[0]}')">${m[1]}</button>`).join('')}</aside><main class="main">${content}</main></div>`}
function traineeDash(){let u=S.u,g=100-u.comp['Climate Modelling'];return `<div class="welcome"><div><h1>Good morning, ${esc(u.name.split(' ')[0])} 👋</h1><div class="muted">Your learning journey at a glance.</div></div><button class="btn primary" onclick="nav('courses')">Explore courses</button></div><div class="grid stats">${stat('Overall progress',u.progress+'%','Learning completion')}${stat('Certificates',u.cert,'Verified achievements')}${stat('Active courses',D.courses.filter(c=>c.enrolled).length,'Currently enrolled')}${stat('Largest competency gap',g+'%','Development opportunity')}</div><div class="grid two" style="margin-top:17px"><div class="card heroCard"><h3>Competency-first learning</h3><p class="muted">Your profile shows a development opportunity in <b>Climate Modelling</b>.</p><div class="row"><span>Climate Modelling</span><b>${u.comp['Climate Modelling']}%</b></div><div class="bar" style="margin:8px 0 18px"><i style="width:${u.comp['Climate Modelling']}%"></i></div><button class="btn light" onclick="nav('competency')">View competency map</button></div><div class="card"><h3>Recommended for you</h3><div class="list">${D.courses.filter(c=>!c.enrolled).slice(0,2).map(c=>`<div class="item"><div class="row"><b>${esc(c.title)}</b>${badge('Recommended','green')}</div><small class="muted">${c.comp} • ${c.duration}</small><br><button class="btn light" style="margin-top:8px" onclick="course(${c.id})">View course</button></div>`).join('')}</div></div></div><div class="grid two" style="margin-top:17px"><div class="card"><h3>My active learning</h3>${D.courses.filter(c=>c.enrolled).map(c=>`<div class="item" style="margin:9px 0"><div class="row"><b>${esc(c.title)}</b><span>${c.progress}%</span></div><div class="bar" style="margin-top:8px"><i style="width:${c.progress}%"></i></div></div>`).join('')}</div><div class="card"><h3>Recent notifications</h3><div class="list">${['New learning content: Satellite Meteorology','Trainer questionnaire deadline: 18 Sep 2026','Assessment result published: Weather Forecasting'].map((x,i)=>`<div class="item"><b>${x}</b><small class="muted">${i?'Yesterday':'Today'}</small></div>`).join('')}</div></div></div>`}
function trainerDash(){return `<div class="welcome"><div><h1>Trainer Dashboard</h1><div class="muted">Manage expertise, content and trainee progress.</div></div><button class="btn primary" onclick="nav('library')">Open trainer library</button></div><div class="grid stats">${stat('Active courses',3,'Published programmes')}${stat('Learners',48,'Across your courses')}${stat('Resources',24,'Library items')}${stat('Questionnaires',2,'Pending responses')}</div><div class="grid two" style="margin-top:17px"><div class="card"><h3>Course performance</h3>${D.courses.slice(0,3).map(c=>`<div class="item" style="margin:9px 0"><div class="row"><b>${esc(c.title)}</b>${badge('Live','green')}</div><small class="muted">Average completion</small><div class="bar" style="margin-top:7px"><i style="width:${Math.max(45,c.progress)}%"></i></div></div>`).join('')}</div><div class="card"><h3>Trainer questionnaire</h3><p class="muted">Annual expertise questionnaire is due on <b>18 Sep 2026</b>.</p><button class="btn primary" onclick="nav('questionnaire')">Complete questionnaire</button></div></div>`}
function adminDash(){return `<div class="welcome"><div><h1>Admin Command Center</h1><div class="muted">Central view of capacity-building activity.</div></div><button class="btn primary" onclick="nav('analytics')">View analytics</button></div><div class="grid stats">${stat('Users','1,284','Across all roles')}${stat('Courses','86','Published programmes')}${stat('Enrollments','3,742','Current + completed')}${stat('Certifications','2,416','Issued to date')}</div><div class="grid two" style="margin-top:17px"><div class="card"><h3>Platform health</h3>${[['Active trainees','78%'],['Assessment completion','84%'],['Course feedback','71%'],['Trainer profiles complete','92%']].map(x=>`<div style="margin:15px 0"><div class="row"><b>${x[0]}</b><span>${x[1]}</span></div><div class="bar" style="margin-top:7px"><i style="width:${x[1]}"></i></div></div>`).join('')}</div><div class="card"><h3>Pending actions</h3><div class="list">${['12 trainer profiles awaiting approval','7 new course submissions','19 certificates awaiting verification','3 questionnaire deadlines this week'].map(x=>`<div class="item row"><span>${x}</span>${badge('Review','amber')}</div>`).join('')}</div></div></div>`}
function profile(){let u=S.u;return `<div class="welcome"><div><h1>${u.role==='Trainer'?'Trainer Profile':'My Profile'}</h1><div class="muted">Professional competency passport.</div></div><button class="btn primary" onclick="editProfile()">Edit profile</button></div><div class="grid two"><div class="card"><div class="row"><span class="avatar" style="width:58px;height:58px">${u.initials}</span><div style="flex:1"><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div>${badge(u.role)}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="grid two"><div><small class="muted">Qualification</small><br><b>${u.qualification||'—'}</b></div><div><small class="muted">Experience</small><br><b>${u.experience||'—'}</b></div></div></div><div class="card"><h3>Skills & competencies</h3>${(u.skills||[]).map(x=>badge(x,'green')+' ').join('')}<h3 style="margin-top:20px">Competency levels</h3>${Object.entries(u.comp||{}).map(([k,v])=>`<div style="margin:13px 0"><div class="row"><b>${k}</b><span>${v}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${v}%"></i></div></div>`).join('')}</div></div>`}
function courses(){return `<div class="welcome"><div><h1>${S.u.role==='Trainer'?'My Courses':'Course Catalogue'}</h1><div class="muted">${S.u.role==='Trainee'?'Explore training aligned to your competencies.':'Manage learning programmes.'}</div></div><button class="btn primary" onclick="toast('Demo: course creation flow')">+ Add course</button></div><div class="grid three">${D.courses.map(c=>`<div class="card course"><div>${badge(c.level)} ${c.enrolled?badge('Enrolled','green'):''}</div><h3>${esc(c.title)}</h3><small class="muted">${c.subject} • ${c.duration} • ${c.trainer}</small><p class="muted">${esc(c.desc)}</p>${c.enrolled?`<div><div class="row"><small>Progress</small><b>${c.progress}%</b></div><div class="bar"><i style="width:${c.progress}%"></i></div></div>`:''}<div class="actions"><button class="btn ${c.enrolled?'light':'primary'}" onclick="course(${c.id})">${c.enrolled?'Continue learning':'View & enroll'}</button></div></div>`).join('')}</div>`}
function competency(){let u=S.u;return `<div class="welcome"><div><h1>Competency Map</h1><div class="muted">Transparent view of capability and development gaps.</div></div>${badge('Competency Passport','green')}</div><div class="grid two"><div class="card"><h3>Current competency profile</h3>${Object.entries(u.comp||{}).map(([k,v])=>`<div style="margin:18px 0"><div class="row"><b>${k}</b><span>${v}%</span></div><div class="bar" style="margin-top:7px"><i style="width:${v}%"></i></div><small class="muted">${v>=80?'Strong':'Development opportunity'}</small></div>`).join('')}</div><div class="card"><h3>Recommended path</h3><p class="muted">Recommendations use the profile, competency matrix and assessment outcomes.</p>${Object.entries(u.comp||{}).sort((a,b)=>a[1]-b[1]).slice(0,2).map(([k,v])=>{let c=D.courses.find(x=>x.comp===k);return `<div class="item" style="margin:11px 0"><div class="row"><b>${k}</b>${badge(v<60?'Priority':'Improve','amber')}</div><small class="muted">${v}% current level</small>${c?`<br><button class="btn light" style="margin-top:7px" onclick="course(${c.id})">Open recommendation</button>`:''}</div>`}).join('')}</div></div><div class="card" style="margin-top:17px"><h3>Suitable trainers</h3><div class="grid three">${D.trainers.map(t=>`<div class="item"><div class="row"><b>${t.name}</b>${badge(t.match+'% match','green')}</div><small class="muted">${t.expertise}</small><br><button class="btn light" style="margin-top:8px" onclick="toast('Trainer request sent')">Request trainer</button></div>`).join('')}</div></div>`}
function assessments(){return `<div class="welcome"><div><h1>Assessments</h1><div class="muted">Subject-wise MCQs measure learning outcomes.</div></div></div><div class="grid two">${D.assess.map(a=>`<div class="card"><div class="row">${badge(a.status,a.status==='Completed'?'green':'amber')}<b style="font-size:25px">${a.score?a.score+'%':'—'}</b></div><h3>${a.title}</h3><small class="muted">${a.course} • 5 questions</small><br><button class="btn ${a.status==='Completed'?'light':'primary'}" style="margin-top:13px" onclick="quiz(${a.id})">${a.status==='Completed'?'Review result':'Start assessment'}</button></div>`).join('')}</div>`}
function feedback(){return `<div class="welcome"><div><h1>Course Feedback</h1><div class="muted">Help improve training delivery.</div></div></div><div class="card" style="max-width:760px"><div class="field"><label>Course</label><select>${D.courses.map(c=>`<option>${c.title}</option>`).join('')}</select></div><div class="field"><label>Rating</label><select><option>5 — Excellent</option><option>4 — Very good</option><option>3 — Good</option></select></div><div class="field"><label>Comments</label><textarea rows="5" placeholder="What worked well? What should improve?"></textarea></div><button class="btn primary" onclick="toast('Feedback submitted successfully')">Submit feedback</button></div>`}
function notifications(){return `<div class="welcome"><div><h1>Notifications</h1><div class="muted">Announcements, deadlines and learning updates.</div></div></div><div class="card"><div class="list">${['New learning content added: Satellite Meteorology','Trainer questionnaire deadline: 18 Sep 2026','Assessment result published: Weather Forecasting','Certificate available for download','New course catalogue published'].map((x,i)=>`<div class="item row"><div><b>${x}</b><small class="muted">${i?'Yesterday':'Today'}</small></div>${badge('View','green')}</div>`).join('')}</div></div>`}
function library(){return `<div class="welcome"><div><h1>Trainer Library</h1><div class="muted">Recorded lectures, presentations and study materials.</div></div><button class="btn primary" onclick="toast('Resource added')">+ Add resource</button></div><div class="grid three">${['Forecasting Masterclass — Recorded Lecture','NWP Presentation — Week 3','Climate Models — Study Notes','Satellite Imagery Lab'].map((x,i)=>`<div class="card"><div>${badge(i<2?'Video':'Document','green')}</div><h3 style="margin-top:13px">${x}</h3><small class="muted">Secure trainer resource • controlled access</small><br><button class="btn light" style="margin-top:13px" onclick="toast('Opening demo resource')">Open resource</button></div>`).join('')}</div>`}
function questionnaire(){return `<div class="welcome"><div><h1>Trainer Questionnaire</h1><div class="muted">Keep expertise and availability current.</div></div>${badge('Due 18 Sep 2026','amber')}</div><div class="card" style="max-width:820px"><div class="field"><label>Primary expertise</label><input value="Numerical Weather Prediction, Climate Modelling, Satellite Meteorology"></div><div class="field"><label>Years of experience</label><input value="12"></div><div class="field"><label>Topics available to teach</label><textarea rows="4">Forecasting workflows, climate modelling fundamentals, satellite meteorology.</textarea></div><button class="btn primary" onclick="toast('Questionnaire submitted');nav('dashboard')">Save questionnaire</button></div>`}
function trainees(){return `<div class="welcome"><div><h1>Trainee Monitoring</h1><div class="muted">Participation and performance at a glance.</div></div></div><div class="card tablewrap"><table class="table"><tr><th>Trainee</th><th>Course</th><th>Progress</th><th>Assessment</th><th>Status</th></tr>${[['Aarav Sharma','Advanced Weather Forecasting','72%','84%','On track'],['Priya Singh','Climate Modelling Fundamentals','64%','78%','On track'],['Rahul Verma','Satellite Meteorology','38%','62%','Needs attention'],['Sneha Rao','Python for Meteorological Data','91%','94%','Excellent']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${badge(r[4],r[4]==='Needs attention'?'red':'green')}</td></tr>`).join('')}</table></div>`}
function users(){return `<div class="welcome"><div><h1>User Management</h1><div class="muted">Approval and role management.</div></div><button class="btn primary" onclick="toast('Invite user flow opened')">+ Invite user</button></div><div class="card tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>${[['Aarav Sharma','trainee@capacityconnect.demo','Trainee','Active'],['Dr. Meera Iyer','trainer@capacityconnect.demo','Trainer','Active'],['Kavya Rao','kavya@capacityconnect.demo','Trainer','Pending approval'],['Vikram Singh','vikram@capacityconnect.demo','Trainee','Active']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${badge(r[2])}</td><td>${badge(r[3],r[3]==='Active'?'green':'amber')}</td><td><button class="btn light" onclick="toast('Demo action completed')">${r[3]==='Active'?'Manage':'Approve'}</button></td></tr>`).join('')}</table></div>`}
function analytics(){return `<div class="welcome"><div><h1>Analytics</h1><div class="muted">Courses, enrollment, assessment and certification overview.</div></div></div><div class="grid three">${stat('Completion rate','78%','Active courses')}${stat('Assessment pass rate','86%','Latest cycle')}${stat('Feedback response','71%','Course evaluations')}</div><div class="card" style="margin-top:17px"><h3>Training activity</h3>${[['Meteorology','89%'],['Climate Science','74%'],['Remote Sensing','68%'],['Data Science','81%']].map(x=>`<div style="margin:15px 0"><div class="row"><b>${x[0]}</b><span>${x[1]}</span></div><div class="bar" style="margin-top:7px"><i style="width:${x[1]}"></i></div></div>`).join('')}</div>`}
function course(id){let c=D.courses.find(x=>x.id===id);$('modal').innerHTML=`<div class="modalbox"><div class="row"><h2>${esc(c.title)}</h2><button class="btn light" onclick="closeM()">Close</button></div><p class="muted">${esc(c.desc)}</p><div class="grid three"><div class="item"><b>Subject</b><br>${c.subject}</div><div class="item"><b>Trainer</b><br>${c.trainer}</div><div class="item"><b>Competency</b><br>${c.comp}</div></div><h3 style="margin-top:20px">Learning resources</h3><div class="list"><div class="item">▶ Recorded lecture — Introduction</div><div class="item">▣ Presentation — Core concepts</div><div class="item">▤ Study material — Practical guide</div></div><button class="btn primary" style="margin-top:18px" onclick="${c.enrolled?`closeM();nav('assessments')`:`enroll(${c.id})`}">${c.enrolled?'Continue to assessment':'Enroll in course'}</button></div>`;$('modal').classList.remove('hide')}
function enroll(id){let c=D.courses.find(x=>x.id===id);c.enrolled=true;closeM();toast('Course enrolled successfully');render()}function closeM(){$('modal').classList.add('hide')}
function quiz(id){let a=D.assess.find(x=>x.id===id);if(a.status==='Completed'){$('modal').innerHTML=`<div class="modalbox"><h2>${a.title}</h2><div class="heroCard card"><div style="font-size:42px;font-weight:900">${a.score}%</div><div>Score recorded and linked to competency progress.</div></div><button class="btn light" style="margin-top:15px" onclick="closeM()">Close</button></div>`;$('modal').classList.remove('hide');return}let qs=['Which activity best supports operational forecasting?','What is a competency gap?','Why are assessment results useful in a competency passport?','Which layer stores structured profile and course data?','What is the purpose of role-based access?'];$('modal').innerHTML=`<div class="modalbox"><div class="row"><h2>${a.title}</h2><button class="btn light" onclick="closeM()">Close</button></div><p class="muted">Demo assessment • 5 questions</p>${qs.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q}</b><label><input type="radio" name="q${i}"> Option A</label><label><input type="radio" name="q${i}"> Option B</label><label><input type="radio" name="q${i}"> Option C</label></div>`).join('')}<button class="btn primary" onclick="submitQuiz(${id})">Submit assessment</button></div>`;$('modal').classList.remove('hide')}
function submitQuiz(id){let a=D.assess.find(x=>x.id===id);a.status='Completed';a.score=92;S.u.comp['Climate Modelling']=55;S.u.progress=Math.min(100,S.u.progress+4);closeM();toast('Assessment submitted — score 92%');render()}function editProfile(){$('modal').innerHTML=`<div class="modalbox"><h2>Edit profile</h2><div class="field"><label>Full name</label><input id="en" value="${esc(S.u.name)}"></div><div class="field"><label>Skills</label><input id="es" value="${esc((S.u.skills||[]).join(', '))}"></div><button class="btn primary" onclick="S.u.name=$('en').value;S.u.skills=$('es').value.split(',').map(x=>x.trim()).filter(Boolean);closeM();toast('Profile updated');render()">Save changes</button></div>`;$('modal').classList.remove('hide')}
function render(){if(!S.u){renderLogin();return}let p={dashboard:S.u.role==='Trainee'?traineeDash:S.u.role==='Trainer'?trainerDash:adminDash,profile,courses,competency,assessments,feedback,notifications,library,questionnaire,trainees,users,analytics}[S.page]||dashboard; if(S.page==='dashboard')p={Trainee:traineeDash,Trainer:trainerDash,Admin:adminDash}[S.u.role];$('root').innerHTML=shell(p())}render();
</script></body></html>
